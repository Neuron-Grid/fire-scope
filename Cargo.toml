[package]
name = "fire-scope"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Neuron Grid <neuron-grid@neuron-grid.net>"]
license = "MPL-2.0"
readme = "README_eng.md"
repository = "https://github.com/Neuron-Grid/fire-scope"
description = "CLI that builds country and AS IPv4/IPv6 lists in TXT or nftables format and calculates CIDR overlaps."
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "fire-scope"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util"] }
reqwest = { version = "0.12.23", features = ["json", "rustls-tls", "stream"] }
chrono = "0.4.41"
futures = "0.3.31"
ipnet = "2.11.0"
rand = "0.9.2"
clap = { version = "4.5.45", features = ["derive"] }
thiserror = "2.0.16"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
rayon = "1.11.0"
